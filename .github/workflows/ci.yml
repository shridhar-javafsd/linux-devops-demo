name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: bash -n healthcheck.sh
      - name: Test
        run: chmod +x *.sh && ./test.sh
      - uses: actions/upload-artifact@v4
        with:
          name: healthcheck
          path: healthcheck.sh
